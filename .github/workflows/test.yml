name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install MCP dependency
        run: python -m pip install -r requirements-mcp.txt
      - name: Compile
        run: python -m compileall -q scripts canvas_study mcp_server
      - name: Import MCP server
        run: python -c "from mcp_server.server import mcp; assert mcp"
      - name: Test
        run: python -m unittest discover -s tests -v
